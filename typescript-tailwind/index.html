<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Produk Interaktif</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
    <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-slate-900">RevoShop Catalog</h1>
            <div class="flex items-center gap-2">
                <span class="font-medium text-sm text-slate-600">Keranjang:</span>
                <span id="cartBadge" class="bg-blue-600 text-white font-bold text-xs px-2.5 py-1 rounded-full">0</span>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">
        <div class="mb-6 flex flex-col sm:flex-row gap-4 justify-between items-center">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Cari produk atau kategori..." 
                class="w-full sm:w-80 px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white"
            >
        </div>

        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </main>

    <!-- Transpilasi manual atau link file JS hasil compile / runtime -->
    <script src="dist/index.js"></script>
</body>
</html>
